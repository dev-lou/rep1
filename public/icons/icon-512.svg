<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Camera body -->
  <rect x="96" y="176" width="320" height="192" rx="32" fill="white" opacity="0.95"/>
  <!-- Viewfinder bump -->
  <rect x="176" y="144" width="160" height="40" rx="12" fill="white" opacity="0.85"/>
  <!-- Lens outer -->
  <circle cx="256" cy="272" r="68" fill="#e2e8f0"/>
  <!-- Lens inner -->
  <circle cx="256" cy="272" r="52" fill="#1e293b"/>
  <!-- Lens highlight -->
  <circle cx="234" cy="250" r="16" fill="white" opacity="0.2"/>
  <!-- Flash -->
  <rect x="312" y="156" width="40" height="20" rx="6" fill="#fbbf24" opacity="0.5"/>
